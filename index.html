<!DOCTYPE html>
<html>
<head>
    <title>CYBER DECK LOGIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">
    <div class="max-w-md mx-auto mt-10">
        <h1 class="text-2xl font-bold text-center mb-6">CYBER DECK LOGIN</h1>
        <form id="loginForm" class="bg-gray-800 p-6 rounded-lg">
            <input type="email" id="email" placeholder="Email" class="w-full p-2 mb-4 bg-gray-700 rounded text-white" required>
            <input type="password" id="pass" placeholder="Password" class="w-full p-2 mb-4 bg-gray-700 rounded text-white" required>
            <button type="submit" class="w-full bg-blue-600 p-2 rounded hover:bg-blue-700">LOGIN SYSTEM</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;

            // Logika login (Ganti email/pass sesuai keinginan lu)
            if (email === "admin@cyberx.com" && pass === "dimas123") {
                localStorage.setItem("user_session", "active");
                window.location.href = "admin.html";
            } else {
                alert("ACCESS DENIED!");
            }
        });
    </script>
</body>
</html>
