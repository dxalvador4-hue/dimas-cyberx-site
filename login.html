    <script>
        function showAlert(message, type) {
            const box = document.getElementById('alertBox');
            box.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
            
            if(type === 'error') {
                box.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400', 'shake');
                setTimeout(() => box.classList.remove('shake'), 300);
            } else {
                box.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
            }
            box.innerHTML = message;
        }

        function switchTab(tab) {
            const forms = ['formLogin', 'formRegister', 'formReset'];
            forms.forEach(f => document.getElementById(f).classList.add('hidden'));
            
            const tabContainer = document.getElementById('tabContainer');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            
            document.getElementById('alertBox').classList.add('hidden');

            if (tab === 'login' || tab === 'register') {
                tabContainer.classList.remove('hidden');
                if (tab === 'login') {
                    document.getElementById('formLogin').classList.remove('hidden');
                    tabLogin.classList.replace('text-zinc-500', 'text-white');
                    tabLogin.classList.replace('bg-transparent', 'bg-white/[0.05]');
                    tabRegister.classList.replace('text-white', 'text-zinc-500');
                    tabRegister.classList.replace('bg-white/[0.05]', 'bg-transparent');
                } else {
                    document.getElementById('formRegister').classList.remove('hidden');
                    tabRegister.classList.replace('text-zinc-500', 'text-white');
                    tabRegister.classList.replace('bg-transparent', 'bg-white/[0.05]');
                    tabLogin.classList.replace('text-white', 'text-zinc-500');
                    tabLogin.classList.replace('bg-white/[0.05]', 'bg-transparent');
                }
            } else if (tab === 'reset') {
                tabContainer.classList.add('hidden'); // Sembunyikan tab atas pas lagi mode reset
                document.getElementById('formReset').classList.remove('hidden');
            }
        }

        function handleReset(e) {
            e.preventDefault();
            const btn = document.getElementById('btnReset');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = 'OVERRIDING...';
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            const params = new URLSearchParams();
            params.append('action', 'reset');
            params.append('email', document.getElementById('resetEmail').value);
            params.append('new_password', document.getElementById('resetPassword').value);

            fetch('auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showAlert(data.message, 'success');
                    document.getElementById('formReset').reset();
                    setTimeout(() => switchTab('login'), 2000);
                } else {
                    showAlert(data.message, 'error');
                }
            })
            .catch(err => showAlert("Koneksi ke Engine Error!", 'error'))
            .finally(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            });
        }

        // Script untuk handleLogin dan handleRegister tetap sama seperti sebelumnya
        function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btnRegister');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'PROCESSING...';
            btn.disabled = true;
            btn.classList.add('opacity-50');

            const params = new URLSearchParams();
            params.append('action', 'register');
            params.append('name', document.getElementById('regName').value);
            params.append('email', document.getElementById('regEmail').value);
            params.append('password', document.getElementById('regPassword').value);

            fetch('auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showAlert(data.message, 'success');
                    document.getElementById('formRegister').reset();
                    setTimeout(() => switchTab('login'), 2000);
                } else {
                    showAlert(data.message, 'error');
                }
            })
            .finally(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'AUTHENTICATING...';
            btn.disabled = true;
            btn.classList.add('opacity-50');

            const params = new URLSearchParams();
            params.append('action', 'login');
            params.append('email', document.getElementById('loginEmail').value);
            params.append('password', document.getElementById('loginPassword').value);

            fetch('auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showAlert(data.message, 'success');
                    setTimeout(() => window.location.href = data.role === 'ADMIN' ? 'admin.php' : 'index.php', 1000);
                } else {
                    showAlert(data.message, 'error');
                }
            })
            .finally(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            });
        }
    </script>

    <script>
        const audio = document.getElementById('cyberCoreMusic');
        const toggleBtn = document.getElementById('musicToggleBtn');
        const eqBars = [ document.getElementById('eqBar1'), document.getElementById('eqBar2'), document.getElementById('eqBar3'), document.getElementById('eqBar4') ];

        function toggleCyberMusic() {
            if (audio.paused) {
                audio.play().then(() => { localStorage.setItem('cyber_music_state', 'playing'); updateAudioUI(true); });
            } else {
                audio.pause(); localStorage.setItem('cyber_music_state', 'paused'); updateAudioUI(false);
            }
        }

        function changeCyberVolume(vol) { audio.volume = vol; localStorage.setItem('cyber_music_volume', vol); }

        // FUNGSI GANTI LAGU BARU
        function changeTrack(url) {
            audio.src = url;
            audio.play().then(() => {
                localStorage.setItem('cyber_music_state', 'playing');
                localStorage.setItem('cyber_music_track', url);
                updateAudioUI(true);
            });
        }

        function updateAudioUI(isPlaying) {
            if (isPlaying) {
                toggleBtn.innerText = "PAUSE"; toggleBtn.className = "bg-cyan-500 text-black font-bold px-2 py-0.5 rounded text-[10px] hover:bg-cyan-400 transition cursor-pointer uppercase";
                eqBars.forEach(bar => bar.classList.remove('paused-anim'));
            } else {
                toggleBtn.innerText = "PLAY"; toggleBtn.className = "bg-white text-black font-bold px-2 py-0.5 rounded text-[10px] hover:bg-cyan-400 transition cursor-pointer uppercase";
                eqBars.forEach(bar => bar.classList.add('paused-anim'));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedVolume = localStorage.getItem('cyber_music_volume');
            if (savedVolume !== null) { audio.volume = savedVolume; document.getElementById('volumeControl').value = savedVolume; }
            
            // Simpan track lagu terakhir yang dimainkan
            const savedTrack = localStorage.getItem('cyber_music_track');
            if (savedTrack) {
                audio.src = savedTrack;
                const selector = document.getElementById('trackSelector');
                if (selector) selector.value = savedTrack;
            }

            const savedState = localStorage.getItem('cyber_music_state');
            if (savedState === 'playing') { audio.play().then(() => { updateAudioUI(true); }).catch(() => { updateAudioUI(false); }); } 
            else { updateAudioUI(false); }
        });
    </script>
