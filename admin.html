<!DOCTYPE html>
<html>
<head>
    <title>ADMIN PANEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-500 p-6">
    <h1 class="text-3xl font-bold">WELCOME TO ADMIN PANEL</h1>
    <p>Sistem ini sudah berjalan di mode Static Web.</p>
    <button onclick="logout()" class="mt-4 bg-red-600 p-2 rounded text-white">LOGOUT</button>

    <script>
        // Proteksi: Kalau nggak ada session, lempar balik ke login
        if (localStorage.getItem("user_session") !== "active") {
            window.location.href = "index.html";
        }

        function logout() {
            localStorage.removeItem("user_session");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
